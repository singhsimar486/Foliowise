# Local development and test stack.
#
#   docker compose up -d db      # just Postgres, for running pytest locally
#   docker compose up            # Postgres plus the API on http://localhost:8000
#
# The test database is created alongside the dev one so `pytest` has somewhere
# to truncate between tests without touching development data.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foliowise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create-test-db.sh:/docker-entrypoint-initdb.d/create-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/foliowise
      SECRET_KEY: local-development-secret-not-for-production
      FRONTEND_URL: http://localhost:4200
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

name: CI

# Runs on every push and on every pull request into main, so a branch cannot be
# merged without the suite going green first.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (pytest + PostgreSQL)
    runs-on: ubuntu-latest

    # A real PostgreSQL instance rather than SQLite, because the application
    # runs on Postgres in production and the test suite relies on Postgres
    # behaviour such as TRUNCATE ... CASCADE and server-side column defaults.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foliowise_test
        ports:
          - 5432:5432
        # The job must not start running tests before the database can accept
        # connections, so the step waits on pg_isready.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foliowise_test
      SECRET_KEY: ci-secret-key-not-used-outside-ci

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: foliowise-api:ci

      # Building is not enough: this proves the image actually starts and the
      # health endpoint Render polls responds inside the container.
      - name: Start the container and check /health
        run: |
          docker run -d --name foliowise-api -p 8000:8000 \
            -e DATABASE_URL=postgresql://unused:unused@localhost:5432/unused \
            -e SECRET_KEY=ci-secret \
            foliowise-api:ci
          for attempt in $(seq 1 15); do
            if curl --silent --fail http://localhost:8000/health; then
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"
          docker logs foliowise-api
          exit 1

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build
